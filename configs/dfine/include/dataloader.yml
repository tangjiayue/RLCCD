
train_dataloader:
  dataset:
    transforms:
      ops:
        # - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
             
        - {type: RandomIoUCrop, p: 0.8}
        - {type: RandomVerticalFlip, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip, p: 0.8}
        - {type: Resize, size: [640, 640], }
        # - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 82 # epoch in [71, ~) stop `ops`
        # ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
        ops: ['RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    # base_size: 800
    base_size_repeat: 3
    stop_epoch: 82 # epoch in [72, ~) stop `multiscales`

  shuffle: True
  total_batch_size: 64   # total batch size equals to 32 (4 * 8)
  accum_steps: 1
  num_workers: 4

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        # - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 64
  # total_batch_size: 8
  num_workers: 4
